# Common Fly.io operations. Run `mise install` once, then `mise run <task>`.
# See docs/deploy.md.
[tools]
flyctl = "latest"
jq = "latest"

[env]
FLY_APP = "todoit"          # flyctl reads FLY_APP; fly.toml names the same app
TODO_DB = "/data/todo.db"   # database path on the server (see Dockerfile)
TODO_CONFIG = "/etc/todo/config.yaml"   # settings file in the image (see Dockerfile)

[tasks."fly:login"]
description = "Log in to Fly.io (opens the browser)"
run = "fly auth login"

[tasks."fly:setup"]
description = "Create the Fly app and its 1 GB volume (run once)"
run = [
  "fly apps create $FLY_APP",
  "fly volumes create todo_data --size 1 --region waw --yes",
]

[tasks."fly:build"]
description = "Build the image on Fly without deploying it"
run = "fly deploy --build-only"

[tasks."fly:deploy"]
description = "Deploy the current code to the one machine"
run = "fly deploy --ha=false"

[tasks."fly:status"]
description = "Show the app and machine state"
run = "fly status"

[tasks."fly:logs"]
description = "Show the app logs"
run = "fly logs"

[tasks."fly:open"]
description = "Open the app in the browser"
run = "fly apps open"

# SSH does not go through Fly's proxy, so it does not start a stopped machine.
# A web request does: the proxy starts the machine and answers when it is up.
[tasks."fly:wake"]
description = "Start the machine if it is stopped"
hide = true
run = "curl -fsS -o /dev/null --retry 3 https://$FLY_APP.fly.dev/login"

[tasks."fly:users"]
depends = ["fly:wake"]
description = "List the users"
run = 'fly ssh console -C "/todo users list -db $TODO_DB -config $TODO_CONFIG"'

[tasks."fly:reset-password"]
depends = ["fly:wake"]
description = "Set a new random password for a user and print it"
usage = 'arg "<name>" help="Username"'
run = 'fly ssh console -C "/todo users reset-password -db $TODO_DB -config $TODO_CONFIG -- ${usage_name}"'

[tasks."fly:delete-user"]
depends = ["fly:wake"]
description = "Delete a user and all their items (asks first)"
usage = 'arg "<name>" help="Username"'
confirm = "Delete this user and all their items?"
run = 'fly ssh console -C "/todo users delete -yes -db $TODO_DB -config $TODO_CONFIG -- ${usage_name}"'

[tasks."fly:snapshots"]
description = "List the daily snapshots of the data volume"
run = "fly volumes snapshots list \"$(fly volumes list --json | jq -r '.[] | select(.name == \"todo_data\" and .attached_machine_id != null) | .id')\""
