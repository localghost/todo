{{define "add-form"}}<form id="add-form" class="add" hx-post="/items" hx-target="#items" hx-swap="beforeend">
<label class="visually-hidden" for="new-item">New item</label>
<div class="add-row">
<input id="new-item" name="text" placeholder="What needs to be done?" autocomplete="off" value="{{.Text}}"{{if .Focus}} autofocus{{end}}{{if .Error}} aria-invalid="true" aria-describedby="add-error"{{end}}>
<button type="submit">Add</button>
</div>
{{with .Filter}}<p class="filter-hint">New items get the label <span class="chip" data-color="{{.Color}}" data-label="{{.ID}}">{{.Name}}</span></p>
{{end}}{{if .Error}}<p id="add-error" class="error">{{.Error}}</p>{{end}}
</form>{{end}}
