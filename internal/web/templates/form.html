{{define "add-form"}}<form id="add-form" class="add" hx-post="/items" hx-include="#hide-done" hx-target="#items" hx-swap="beforeend"{{if .OOB}} hx-swap-oob="true"{{end}}>
<label class="visually-hidden" for="new-item">New item</label>
<div class="add-row">
<input id="new-item" name="text" placeholder="What needs to be done?" autocomplete="off" value="{{.Text}}"{{if .Focus}} autofocus{{end}}{{if .Error}} aria-invalid="true" aria-describedby="add-error"{{end}}>
<button type="submit">Add</button>
</div>
{{if .Error}}<p id="add-error" class="error">Please type some text first.</p>{{end}}
</form>{{end}}
