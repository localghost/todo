{{define "page"}}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="htmx-config" content='{"historyCacheSize":0,"responseHandling":[{"code":"204","swap":false},{"code":"[23]..","swap":true},{"code":"404","swap":true},{"code":"422","swap":true},{"code":"5..","swap":true,"error":true,"target":"#error","swapOverride":"innerHTML"},{"code":"[45]..","swap":false,"error":true}]}'>
<title>Todo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&display=swap">
<link rel="stylesheet" href="/static/app.css">
<script src="/static/htmx.min.js" defer></script>
<script src="/static/app.js" defer></script>
</head>
<body hx-on::send-error="document.getElementById('error').textContent = 'Cannot reach the server. Please try again.'"
  hx-on::after-request="if (event.detail.successful) document.getElementById('error').textContent = ''">
<main>
<header class="top">
<h1>Todo</h1>
<nav class="user-nav" aria-label="Account">Signed in as <strong>{{.Username}}</strong> · <a href="/account">Account</a> · <form method="post" action="/logout" class="inline-form"><button type="submit" class="link-button">Log out</button></form></nav>
</header>
<p id="error" class="error" role="alert"></p>
{{template "add-form" .Form}}
{{template "list" .List}}
</main>
</body>
</html>
{{end}}
